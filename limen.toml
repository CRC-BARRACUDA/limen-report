[module]
name = "report"
display_name = "Reports"
version = "0.3.0"
language = "native"
entry = "report"
abi = "native"
description = "Generate reports for other modules — a branded PDF."
repo = "CRC-BARRACUDA/limen-report"

[provides]
capabilities = ["report.build"]

[permissions]
# Writes a report where the user chose to put it. `<user-selected>` is a file
# the operating system's own save dialog returned — this module cannot name a
# path of its own, and the person doing the saving picks every one of them.
filesystem = ["<user-selected>"]
