[module]
name = "report"
display_name = "Reports"
version = "0.2.0"
language = "native"
entry = "report"
abi = "native"
description = "Generate reports for other modules — a branded PDF, or Markdown, HTML and CSV."
repo = "CRC-BARRACUDA/limen-report"

[provides]
capabilities = ["report.build"]

[permissions]
# Writes exported reports into a temp folder, then asks the host to open them.
filesystem = ["<system temp>/limen-reports"]
