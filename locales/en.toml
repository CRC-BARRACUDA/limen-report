# Every word this module puts on a screen or into a document. The module card's
# own title and description are not here — the host reads those from limen.toml
# for English.

[ui]
title = "Report"
landing_title = "Report generator"
landing_body = "This module builds reports for other modules — a branded PDF. Open a data module (e.g. Devices) and use its “Make Report” action; the button only appears while this module is installed."

[preview]
meta = "PDF · A4 · {sheets} · JetBrains Mono · GPL-3.0-or-later"
page_one = "1 page"
pages = "{n} pages"
ground = "Ground"
white = "White"
black = "Black"
save = "Save"
close = "Close"
more_rows = "… and {n} more row(s) — all of them are in the PDF"

[save]
cancelled = "Not saved — the save was cancelled."
saved = "Saved"
failed = "Could not write the file"

# Drawn on every page of the document itself.
[doc]
title = "Report"
footer = "LIMEN · Barracuda Team · GPL-3.0-or-later · {generated} · set in JetBrains Mono (SIL OFL 1.1)"
producer = "Generated by Limen · {generated}"
